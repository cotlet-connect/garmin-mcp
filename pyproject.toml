[project]
name = "garmin-cotlet-mcp"
version = "1.1.0"
description = "Connect Garmin Connect to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Garmin Connect API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["garmin connect", "garmin connect api", "garmin connect mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/garmin-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=garmin"
Source = "https://github.com/cotlet-connect/garmin-mcp"

[project.scripts]
garmin-cotlet-mcp = "garmin_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"garmin_agent.py" = "garmin_agent.py"

[tool.hatch.build.targets.sdist]
include = ["garmin_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
